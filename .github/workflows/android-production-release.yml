name: Build Signed Android Production APK

on:
  workflow_dispatch:

concurrency:
  group: android-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-release:
    name: Sign, verify and archive production APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_BUILD: "true"
    steps:
      - name: Checkout reviewed main branch only
        uses: actions/checkout@v5
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Production signing is allowed only from main after the release candidate is reviewed and merged."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate secrets and materialize signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mvmcmd-production.jks"
          test -s "$RUNNER_TEMP/mvmcmd-production.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mvmcmd-production.jks" >> "$GITHUB_ENV"
          echo "Keystore materialized in the ephemeral runner; secret bytes were not printed."
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Audit shipped production dependencies
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/mvmcmd-npm-audit-production.json"
          if npm audit --omit=dev --json > "$REPORT"; then
            echo "Production dependency audit returned success."
          else
            echo "Production dependency audit reported advisories; checking the report."
          fi
          node - "$REPORT" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const v = report.metadata?.vulnerabilities;
          if (!v) throw new Error("Production audit has no vulnerability summary.");
          console.log("npm audit --omit=dev: " + JSON.stringify(v));
          if ((v.total || 0) > 0) {
            for (const [name, advisory] of Object.entries(report.vulnerabilities || {})) {
              console.error("PRODUCTION ADVISORY: " + advisory.severity + " | " + name);
            }
            throw new Error("Known vulnerabilities in production dependencies block release.");
          }
          console.log("PRODUCTION_DEPENDENCY_AUDIT_SUCCESS: 0 known advisories.");
          NODE
      - name: Typecheck and verify release metadata
        run: |
          npm run typecheck
          node scripts/check-release-candidate.mjs
      - name: Build web application
        run: npm run build
      - name: Sync native Android project
        run: npx cap sync android
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signed production APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          REPORT="$RUNNER_TEMP/mvmcmd-apksigner-report.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$REPORT"
          grep -q "Signer #1 certificate SHA-256 digest:" "$REPORT"
          if grep -qi "Android Debug" "$REPORT"; then
            echo "::error::Debug certificate detected; refusing to publish a production artifact."
            exit 1
          fi
          sha256sum "$APK" | tee "$RUNNER_TEMP/mvmcmd-release-apk.sha256"
          echo "### Signed Android release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature verification: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug certificate: not detected" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: $(cut -d' ' -f1 "$RUNNER_TEMP/mvmcmd-release-apk.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: mvmcmd-signed-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Delete signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mvmcmd-production.jks" "$RUNNER_TEMP/mvmcmd-apksigner-report.txt" "$RUNNER_TEMP/mvmcmd-release-apk.sha256"
