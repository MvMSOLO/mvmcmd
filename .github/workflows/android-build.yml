name: Build Android APK
# Capacitor 8 / Java 21 / static Vercel web bundle

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck web application
        run: npm run typecheck

      - name: Run JavaScript/TypeScript tests
        run: npm test

      - name: Verify native launcher source
        shell: bash
        run: |
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q '@CapacitorPlugin(name = "MvmLauncher")' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'registerPlugin(MvmLauncherPlugin.class)' "android/app/src/main/java/com/mvmcmd/launcher/MainActivity.java"

      - name: Build web application
        run: npm run build

      - name: Verify Capacitor web bundle
        shell: bash
        run: |
          test -f ".vercel/output/static/index.html"
          test -d ".vercel/output/static/assets"
          echo "Verified web bundle for Capacitor:"
          ls -lah ".vercel/output/static"

      - name: Sync native Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf 'apk=%s\nsha256=%s\nsize_bytes=%s\ncommit=%s\nrun=%s\n'             "$APK" "$SHA256" "$(stat -c '%s' "$APK")"             "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" > apk-build-manifest.txt

          cat apk-build-manifest.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmcmd-debug-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-build-manifest.txt
          if-no-files-found: error
          retention-days: 14
