name: Build Android APK
# Capacitor 8 / Java 21 / deterministic wallpaper asset bundle

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Audit dependency health (high/critical vulnerabilities block release)
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/mvmcmd-npm-audit.json"
          if npm audit --json > "$REPORT"; then
            echo "npm audit command returned success."
          else
            echo "npm audit reported advisories; evaluating severity."
          fi
          node - "$REPORT" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v) throw new Error("Dependency audit produced no vulnerability summary.");
          console.log("npm audit: " + JSON.stringify(v));
          for (const [name, advisory] of Object.entries(report.vulnerabilities || {})) {
            const via = (advisory.via || []).map((item) => typeof item === "string" ? item : item.name + ": " + item.title).join("; ");
            console.log("AUDIT ADVISORY: " + advisory.severity + " | " + name + " | range=" + advisory.range + " | fix=" + JSON.stringify(advisory.fixAvailable) + " | via=" + via);
          }
          if ((v.critical || 0) > 0) {
            console.error("CRITICAL dependency advisories block the release.");
            process.exit(1);
          }
          if ((v.high || 0) > 0) {
            console.error("HIGH dependency advisories block the release.");
            process.exit(1);
          }
          if ((v.moderate || 0) > 0) console.log("NOTICE: Moderate dependency advisories remain; inspect npm audit details.");
          console.log("Dependency audit policy gate passed (no high/critical vulnerabilities).");
          NODE

      - name: Audit shipped production dependencies (any advisory blocks release)
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/mvmcmd-npm-audit-production.json"
          if npm audit --omit=dev --json > "$REPORT"; then
            echo "Production dependency audit returned success."
          else
            echo "Production dependency audit reported advisories; checking the report."
          fi
          node - "$REPORT" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const v = report.metadata?.vulnerabilities;
          if (!v) throw new Error("Production audit has no vulnerability summary.");
          console.log("npm audit --omit=dev: " + JSON.stringify(v));
          for (const [name, advisory] of Object.entries(report.vulnerabilities || {})) {
            console.log("PRODUCTION ADVISORY: " + advisory.severity + " | " + name + " | range=" + advisory.range);
          }
          if ((v.total || 0) > 0) {
            console.error("Known vulnerabilities in production dependencies block release.");
            process.exit(1);
          }
          console.log("PRODUCTION_DEPENDENCY_AUDIT_SUCCESS: 0 known advisories.");
          NODE

      - name: Typecheck web application
        run: npm run typecheck

      - name: Verify release-candidate metadata
        run: node scripts/check-release-candidate.mjs

      - name: Verify native launcher source
        shell: bash
        run: |
          set -euo pipefail
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmVoicePlugin.java"
          grep -q '@CapacitorPlugin(name = "MvmVoice")' "android/app/src/main/java/com/mvmcmd/launcher/MvmVoicePlugin.java"
          grep -q "SpeechRecognizer" "android/app/src/main/java/com/mvmcmd/launcher/MvmVoicePlugin.java"
          grep -q "TextToSpeech" "android/app/src/main/java/com/mvmcmd/launcher/MvmVoicePlugin.java"
          grep -q "registerPlugin(MvmVoicePlugin.class)" "android/app/src/main/java/com/mvmcmd/launcher/MainActivity.java"
          grep -q "RECORD_AUDIO" "android/app/src/main/AndroidManifest.xml"
          test -s "src/lib/mvm/voice-core.ts"
          test -s "src/lib/mvm/voice-core.test.ts"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q '@CapacitorPlugin' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'name = "MvmLauncher"' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'checkCapabilities' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'requestCapability' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'setCapabilityDecision' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'registerPlugin(MvmLauncherPlugin.class)' "android/app/src/main/java/com/mvmcmd/launcher/MainActivity.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmQrActivity.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmQrTileService.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperActivity.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperRenderer.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperCatalog.java"
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmHomeWallpaperService.java"
          grep -q 'FORMAT_ALL_FORMATS' "android/app/src/main/java/com/mvmcmd/launcher/MvmQrActivity.java"
          grep -q 'openQr' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'ActivityResultContracts.GetContent' "android/app/src/main/java/com/mvmcmd/launcher/MvmQrActivity.java"
          grep -q 'InputImage.fromFilePath' "android/app/src/main/java/com/mvmcmd/launcher/MvmQrActivity.java"
          grep -q 'startActivityAndCollapse' "android/app/src/main/java/com/mvmcmd/launcher/MvmQrTileService.java"
          grep -q 'android.service.quicksettings.action.QS_TILE' "android/app/src/main/AndroidManifest.xml"
          grep -q 'BIND_QUICK_SETTINGS_TILE' "android/app/src/main/AndroidManifest.xml"
          grep -q 'SET_WALLPAPER' "android/app/src/main/AndroidManifest.xml"
          grep -q 'android.service.wallpaper.WallpaperService' "android/app/src/main/AndroidManifest.xml"
          grep -q 'WallpaperService' "android/app/src/main/java/com/mvmcmd/launcher/MvmHomeWallpaperService.java"
          grep -q 'FLAG_LOCK' "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperActivity.java"
          grep -q 'ACTION_CHANGE_LIVE_WALLPAPER' "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperActivity.java"
          grep -q 'EXTRA_LIVE_WALLPAPER_COMPONENT' "android/app/src/main/java/com/mvmcmd/launcher/MvmWallpaperActivity.java"
          grep -q 'wallpaper_description' "android/app/src/main/res/values/strings.xml"
          test -d "scripts/wallpapers-pack-b64"
          test "$(find scripts/wallpapers-pack-b64 -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 11
          test -s "android/app/src/main/res/drawable/mvmcmd_logo.xml"
          test -s "src/lib/mvm/capabilities/types.ts"
          test -s "src/lib/mvm/capabilities/registry.ts"
          test -s "src/lib/mvm/capabilities/store.ts"
          test -s "src/lib/mvm/capabilities/native-adapter.ts"
          test -s "src/lib/mvm/capabilities/manager.ts"
          grep -q 'checkCapabilities' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'requestCapability' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q 'notification_listener' "src/lib/mvm/capabilities/registry.ts"
          ! grep -q 'requestMissingPermissions' "android/app/src/main/java/com/mvmcmd/launcher/MvmNotificationCenterActivity.java"

      - name: Verify global entry point bridge
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/security.cjs
          test -s "android/app/src/main/java/com/mvmcmd/launcher/MvmEntryPointPlugin.java"
          grep -q 'registerPlugin(MvmEntryPointPlugin.class)' "android/app/src/main/java/com/mvmcmd/launcher/MainActivity.java"
          grep -q 'android.app.shortcuts' "android/app/src/main/AndroidManifest.xml"
          grep -q 'android.intent.action.SEND' "android/app/src/main/AndroidManifest.xml"
          test -s "android/app/src/main/res/xml/shortcuts.xml"
          test -s "src/lib/mvm/global-entry-points.test.ts"
          test -s "src/lib/mvm/global-entry-bridge.ts"

      - name: Verify motion and decorative 3D contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s "src/lib/mvm/motion-preferences.ts"
          test -s "src/lib/mvm/motion-preferences.test.ts"
          test -s "src/lib/mvm/compatibility.test.ts"
          grep -q 'mvm-motion-reduced' "src/styles.css"
          grep -q 'prefers-reduced-motion' "src/styles.css"
          ! grep -q 'kernelCadUrl\|app\.kernelcad\.com' "src/lib/mvm/3d-assets.ts"
          grep -q 'event.stopPropagation()' "src/components/mvm/mvm-3d.tsx"

      - name: Verify globalization and Android compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s "src/lib/mvm/compatibility.ts"
          test -s "src/lib/mvm/compatibility.test.ts"
          grep -q "normalizeCommandHead" "src/lib/mvm/commands.ts"
          grep -q "formatAndroidCompatibilityReport" "src/lib/mvm/executor.ts"
          grep -q "Allow restricted settings" "src/lib/mvm/compatibility.ts"
          grep -q "CAPABILITY SNAPSHOTS" "src/lib/mvm/executor.ts"

      - name: Verify Phase 19 release hardening gates
        shell: bash
        run: |
          set -euo pipefail
          test -s "src/lib/mvm/security-policy.ts"
          test -s "src/lib/mvm/security-hardening.test.ts"
          test -s "src/lib/mvm/performance-budget.ts"
          test -s "src/lib/mvm/performance-budget.test.ts"
          test -s "src/lib/mvm/commands.test.ts"
          test -s "src/lib/mvm/gaming-engine.test.ts"
          test -s "android/app/src/androidTest/java/com/mvmcmd/launcher/CoreActivitiesLaunchTest.java"
          test -s "desktop/security.cjs"
          grep -q 'android:allowBackup="false"' "android/app/src/main/AndroidManifest.xml"
          grep -q 'isAllowedExternalUri(url)' "android/app/src/main/java/com/mvmcmd/launcher/MvmLauncherPlugin.java"
          grep -q "safeZipEntryName" "android/app/src/main/java/com/mvmcmd/launcher/MvmFileToolsPlugin.java"
          grep -q "assertTrustedIpcSender" "desktop/main.cjs"
          grep -q "npm audit" ".github/workflows/android-build.yml"

      - name: Run project tests
        run: node --experimental-strip-types --test src/lib/mvm/action-engine.test.ts src/lib/mvm/file-intelligence.test.ts src/lib/mvm/session-context.test.ts src/lib/mvm/voice-core.test.ts src/lib/mvm/global-entry-points.test.ts src/lib/mvm/motion-preferences.test.ts src/lib/mvm/compatibility.test.ts src/lib/mvm/security-hardening.test.ts src/lib/mvm/performance-budget.test.ts src/lib/mvm/app-bridge.test.ts src/lib/mvm/task-planner.test.ts src/lib/mvm/goal-engine.test.ts src/lib/mvm/gaming-engine.test.ts src/lib/mvm/commands.test.ts

      - name: Build web application
        run: npm run build

      - name: Verify Capacitor web bundle
        shell: bash
        run: |
          test -f ".vercel/output/static/index.html"
          test -d ".vercel/output/static/assets"
          echo "Verified web bundle for Capacitor."

      - name: Restore original wallpaper assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mvm_wallpapers android/app/src/main/assets/wallpapers
          mkdir -p /tmp/mvm_wallpapers android/app/src/main/assets/wallpapers
          cat scripts/wallpapers-pack-b64/part-* | base64 -d > /tmp/mvmcmd-wallpapers.zip
          test "$(sha256sum /tmp/mvmcmd-wallpapers.zip | cut -d' ' -f1)" = "df908ba85062bd4d8820e269a92fc0b05d86462337355e5e58a83cddd4dcf30a"
          unzip -q /tmp/mvmcmd-wallpapers.zip -d /tmp/mvm_wallpapers
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("/tmp/mvm_wallpapers")
          out=Path("android/app/src/main/assets/wallpapers")
          out.mkdir(parents=True, exist_ok=True)
          files=sorted(root.glob("*.webp"))
          assert len(files)==17, files
          for src in files:
              with Image.open(src) as im:
                  im.convert("RGB").save(out/(src.stem+".png"), "PNG", compress_level=6, optimize=True)
          assert len(list(out.glob("*.png")))==17
          PY
          test "$(find android/app/src/main/assets/wallpapers -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 17

      - name: Verify wallpaper assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("android/app/src/main/assets/wallpapers")
          files=sorted(root.glob("*.png"))
          assert len(files)==17, len(files)
          for p in files:
              with Image.open(p) as im:
                  print(f"{p.name}: {im.size} {p.stat().st_size} bytes")
                  assert im.width >= 240 and im.height >= 400
          print("Verified 17 PNG wallpaper assets without post-processing blur.")
          PY

      - name: Sync native Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Verify APK wallpaper payload
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          root=Path("android/app/src/main/assets/wallpapers")
          expected=sorted(p.name for p in root.glob("*.png"))
          assert len(expected)==17, expected
          with ZipFile("android/app/build/outputs/apk/debug/app-debug.apk") as z:
              names=set(z.namelist())
              for name in expected:
                  entry="assets/wallpapers/"+name
                  assert entry in names, entry
                  data=z.read(entry)
                  src=(root/name).read_bytes()
                  assert hashlib.sha256(data).digest()==hashlib.sha256(src).digest(), name
          print("Verified APK contains the exact 17 PNG wallpaper payloads.")
          PY

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable; emulator runner will use its supported fallback."
          fi

      - name: Android emulator install and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 35
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: Final success gate
        if: ${{ success() }}
        shell: bash
        run: |
          echo "ACTION_SUCCESS"
          echo "MVMCMD Android build + original wallpaper engine completed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmcmd-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
