name: Build Ultra 4K Pro Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build MVMCMD Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Code Verification & Typecheck
        run: npm run typecheck

      - name: Build Web Production Bundle
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sync Capacitor Android Workspace
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then echo "<html><body>MVMCMD Pro 4K</body></html>" > dist/index.html; fi
          npx cap sync android

      - name: Build Android Unsigned Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmcmd-pro-4k-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
