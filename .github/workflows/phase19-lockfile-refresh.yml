name: Phase 19 — npm lockfile sync

on:
  push:
    branches:
      - phase19-uuid-advisory-fix
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/phase19-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Refresh and validate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile from the declared manifest
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit

      - name: Validate lockfile matches package manifest and overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const root = lock.packages?.[""];
          if (!root) throw new Error("Lockfile root metadata is missing.");
          for (const section of ["dependencies", "devDependencies", "optionalDependencies"]) {
            for (const name of Object.keys(pkg[section] || {})) {
              if (!root[section]?.[name]) throw new Error("Lockfile missing " + section + " entry for " + name);
            }
          }
          for (const [name, expected] of Object.entries(pkg.overrides || {})) {
            const entry = lock.packages?.["node_modules/" + name];
            if (entry && entry.version !== expected) {
              throw new Error(name + " resolved to " + entry.version + " instead of override " + expected);
            }
          }
          if (lock.packages?.["node_modules/electron-builder"]?.version !== pkg.devDependencies["electron-builder"]) {
            throw new Error("electron-builder lock entry does not match package.json.");
          }
          console.log("Lockfile root dependencies match package.json.");
          console.log("electron-builder: " + lock.packages["node_modules/electron-builder"].version);
          console.log("uuid: " + (lock.packages["node_modules/uuid"]?.version || "transitively scoped"));
          NODE

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile with package overrides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
